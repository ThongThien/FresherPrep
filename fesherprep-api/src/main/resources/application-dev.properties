# Development database only: Hibernate creates/updates the schema from entity mappings.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
logging.level.org.springframework.cache.interceptor=TRACE
# Request DTOs can contain credentials. Keep Spring MVC argument/validation
# logging below DEBUG even during local development.
logging.level.org.springframework.web=INFO

spring.application.name=fesherprep-api

spring.config.import=optional:file:.env[.properties]

spring.profiles.active=${APP_PROFILE:prod}

server.port=${SERVER_PORT:8080}

spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=fresherprep
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# Shared published-content cache. Redis is optional at runtime: cache failures
# fall back to PostgreSQL through CacheConfiguration's error handler.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:1s}
spring.data.redis.timeout=${REDIS_TIMEOUT:1s}
spring.data.redis.repositories.enabled=false

spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

security.jwt.issuer=${JWT_ISSUER:fresherprep-api}
security.jwt.secret=${JWT_SECRET}
security.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:PT15M}
security.jwt.refresh-token-ttl=${JWT_REFRESH_TOKEN_TTL:P30D}

security.auth-rate-limit.enabled=${AUTH_RATE_LIMIT_ENABLED:true}
security.auth-rate-limit.window=${AUTH_RATE_LIMIT_WINDOW:PT1M}
security.auth-rate-limit.login-attempts=${AUTH_LOGIN_RATE_LIMIT:10}
security.auth-rate-limit.register-attempts=${AUTH_REGISTER_RATE_LIMIT:5}
security.auth-rate-limit.refresh-attempts=${AUTH_REFRESH_RATE_LIMIT:30}
security.auth-rate-limit.max-clients=${AUTH_RATE_LIMIT_MAX_CLIENTS:10000}

security.login-challenge.enabled=${LOGIN_CHALLENGE_ENABLED:true}
security.login-challenge.failure-threshold=${LOGIN_CHALLENGE_FAILURE_THRESHOLD:3}
security.login-challenge.ttl=${LOGIN_CHALLENGE_TTL:PT3M}
security.login-challenge.failure-retention=${LOGIN_CHALLENGE_FAILURE_RETENTION:PT15M}
security.login-challenge.max-clients=${LOGIN_CHALLENGE_MAX_CLIENTS:10000}

supabase.storage.url=${SUPABASE_URL:}
supabase.storage.secret-key=${SUPABASE_STORAGE_SECRET_KEY:}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:pet-assets}
supabase.storage.max-file-size=${SUPABASE_STORAGE_MAX_FILE_SIZE:2097152}

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

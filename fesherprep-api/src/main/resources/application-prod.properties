# Apply reviewed migrations before starting production; never change schema at startup.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Production API documentation is intentionally disabled. Enable it only in a
# protected non-production environment when it is needed.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Redis is an optional cache and must not make the application readiness check
# fail when PostgreSQL remains available.
management.health.redis.enabled=${REDIS_HEALTH_ENABLED:false}

# Honor proxy forwarding only in the deployment profile, where the backend is
# bound to loopback behind the trusted reverse proxy.
server.forward-headers-strategy=native
spring.devtools.add-properties=false

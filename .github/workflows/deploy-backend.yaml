name: Deploy FresherPrep Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: thongthien2004
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: ./fesherprep-api
          file: ./fesherprep-api/Dockerfile
          push: true
          tags: |
            thongthien2004/fresherprep-api:latest
            thongthien2004/fresherprep-api:${{ github.sha }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            docker pull thongthien2004/fresherprep-api:latest

            docker rm -f fresherprep-api || true

            docker run -d \
              --name fresherprep-api \
              --restart unless-stopped \
              --env-file /opt/fresherprep/FresherPrep/fesherprep-api/.env \
              -p 127.0.0.1:8080:8080 \
              thongthien2004/fresherprep-api:latest

            echo "Waiting for application to start..."
            sleep 10

            curl --fail --silent --show-error \
              http://127.0.0.1:8080/actuator/health

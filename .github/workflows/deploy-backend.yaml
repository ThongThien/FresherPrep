name: Deploy FresherPrep Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: ./fesherprep-api
          file: ./fesherprep-api/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fresherprep-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/fresherprep-api:${{ github.sha }}

      - name: Deploy VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/fresherprep-api:latest

            docker rm -f fresherprep-api || true

            docker run -d \
              --name fresherprep-api \
              --restart unless-stopped \
              --env-file /opt/fresherprep/FresherPrep/fesherprep-api/.env \
              -p 127.0.0.1:8080:8080 \
              ${{ secrets.DOCKERHUB_USERNAME }}/fresherprep-api:latest

            sleep 10

            curl --fail \
              http://127.0.0.1:8080/actuator/health

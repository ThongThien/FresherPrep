name: Deploy FresherPrep Backend

on:
  push:
    branches: [main]
    paths-ignore:
      - "frontend/**"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./fesherprep-api
          file: ./fesherprep-api/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/fresherprep-api:latest
            ${{ secrets.DOCKER_USERNAME }}/fresherprep-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}

          script: |
            set -e

            echo "========================================"
            echo "Deploying FresherPrep Backend"
            echo "========================================"

            echo "1. Pulling latest Docker image..."

            docker pull ${{ secrets.DOCKER_USERNAME }}/fresherprep-api:latest

            echo "2. Stopping old container..."

            docker stop fresherprep-api || true

            echo "3. Removing old container..."

            docker rm fresherprep-api || true

            echo "4. Starting new container..."

            docker run -d \
              --name fresherprep-api \
              --network fresherprep-net \
              --env-file /opt/fresherprep/FresherPrep/fesherprep-api/.env \
              -p 127.0.0.1:8080:8080 \
              --restart unless-stopped \
              ${{ secrets.DOCKER_USERNAME }}/fresherprep-api:latest

            echo "5. Waiting for application..."

            HEALTHY=false

            for i in {1..30}; do
              echo "Health check attempt $i/30..."

              if curl \
                --fail \
                --silent \
                --show-error \
                http://127.0.0.1:8080/actuator/health; then

                HEALTHY=true
                echo ""
                echo "Application is healthy!"
                break
              fi

              echo "Application not ready yet..."
              sleep 5
            done

            if [ "$HEALTHY" != "true" ]; then
              echo ""
              echo "Application failed to become healthy."

              echo "========== Docker Status =========="
              docker ps -a --filter "name=fresherprep-api"

              echo ""
              echo "========== Docker Logs =========="
              docker logs --tail 200 fresherprep-api

              exit 1
            fi

            echo ""
            echo "6. Cleaning unused Docker images..."

            docker image prune -f

            echo ""
            echo "========================================"
            echo "Deployment successful!"
            echo "========================================"

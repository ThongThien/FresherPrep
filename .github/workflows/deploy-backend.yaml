name: Deploy FresherPrep Backend

on:
  push:
    branches: [main]
    paths-ignore:
      - "frontend/**"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ========================================
      # 1. Checkout
      # ========================================
      - name: Checkout code
        uses: actions/checkout@v4

      # ========================================
      # 2. Docker Buildx
      # ========================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ========================================
      # 3. Login Docker Hub
      # ========================================
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # ========================================
      # 4. Build & Push Docker Image
      # ========================================
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./fesherprep-api
          file: ./fesherprep-api/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/fresherprep-api:latest
            ${{ secrets.DOCKER_USERNAME }}/fresherprep-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ========================================
      # 5. Prepare SSH Key
      # ========================================
      - name: Prepare SSH key
        shell: bash
        run: |
          test -n "${{ secrets.VPS_SSH_KEY_B64 }}" || {
            echo "ERROR: VPS_SSH_KEY_B64 is empty"
            exit 1
          }

          echo "${{ secrets.VPS_SSH_KEY_B64 }}" \
            | base64 -d \
            > "$RUNNER_TEMP/fresherprep_deploy_key"

          chmod 600 "$RUNNER_TEMP/fresherprep_deploy_key"

          echo "SSH key fingerprint:"
          ssh-keygen -lf "$RUNNER_TEMP/fresherprep_deploy_key"

      # ========================================
      # 6. Deploy to VPS
      # ========================================
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key_path: ${{ runner.temp }}/fresherprep_deploy_key
          port: ${{ secrets.VPS_PORT }}

          script: |
            set -e

            echo "Pulling latest image..."

            docker pull ${{ secrets.DOCKER_USERNAME }}/fresherprep-api:latest

            echo "Stopping old container..."

            docker stop fresherprep-api || true

            echo "Removing old container..."

            docker rm fresherprep-api || true

            echo "Starting new container..."

            docker run -d \
              --name fresherprep-api \
              --env-file /opt/fresherprep/FresherPrep/fesherprep-api/.env \
              -p 127.0.0.1:8080:8080 \
              --restart unless-stopped \
              ${{ secrets.DOCKER_USERNAME }}/fresherprep-api:latest

            echo "Waiting for application..."

            sleep 10

            echo "Health check..."

            curl \
              --fail \
              --silent \
              --show-error \
              http://127.0.0.1:8080/actuator/health

            echo ""
            echo "Cleaning unused Docker images..."

            docker image prune -f

            echo ""
            echo "Deployment successful!"
